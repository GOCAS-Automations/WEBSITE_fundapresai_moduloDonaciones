# Respaldo semanal de la base (plan §10): exporta campaigns y site_settings a JSON
# y hace commit en la rama «backups» de este mismo repo (historial = versiones).
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   SUPABASE_URL               https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  clave secreta (service_role o sb_secret_...)
#
# La rama «backups» no despliega en Vercel (vercel.json → git.deploymentEnabled).
# Ojo: si el repo es público, los respaldos también lo son (incluidas campañas en
# borrador u ocultas).
name: Respaldo semanal

on:
  schedule:
    - cron: "23 14 * * 1" # lunes, 14:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar la rama backups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BK="$RUNNER_TEMP/backups"
          if git ls-remote --exit-code --heads origin backups >/dev/null; then
            git fetch --depth=1 origin backups
            git worktree add "$BK" FETCH_HEAD
            git -C "$BK" checkout -B backups
          else
            git worktree add --detach "$BK"
            git -C "$BK" checkout --orphan backups
            git -C "$BK" rm -rf --quiet .
          fi
          echo "BK=$BK" >> "$GITHUB_ENV"

      - name: Exportar a JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL o SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi
          # Solo se necesita tsx (el script no usa otras dependencias).
          npx --yes tsx@4 scripts/backup.ts --out "$BK/data"

      - name: Guardar en la rama backups
        run: |
          cd "$BK"
          printf '%s\n' "# Respaldos de Fundapresai" "" \
            "Rama automática (.github/workflows/backup.yml). Cada commit es un respaldo semanal." \
            "Archivos: data/campaigns.json, data/site_settings.json y data/meta.json." > README.md
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios desde el último respaldo."
          else
            git commit -m "Respaldo semanal $(date -u +%Y-%m-%d)"
            git push origin backups
          fi
